image: "python:3.12"
variables:
  PIXI_CACHE_DIR: "$CI_PROJECT_DIR/.pixi_cache"

tests:
  image: "python:${PYTHON_VERSION}"
  before_script:
    - curl -fsSL https://pixi.sh/install.sh | bash
    - export PATH="$HOME/.pixi/bin:$PATH"
    - pixi install --locked
    - eval "$(pixi shell-hook)"
    - pip install tox
  script:
    - tox -r -e "$TOX_ENV"
  parallel:
    matrix:
      - PYTHON_VERSION: "3.12"
        TOX_ENV: "py312"
      - PYTHON_VERSION: "3.13"
        TOX_ENV: "py313"
      - PYTHON_VERSION: "3.14"
        TOX_ENV: "py314"
      - PYTHON_VERSION: "3.15"
        TOX_ENV: "py315"
flake8:
  before_script:
    - pip install tox
  script:
    - tox -e flake8
