[tox]
envlist=py312, py313, py314, py315

[testenv]
commands=
	py.test --cov-report term-missing --cov=quasitools tests/
passenv =
    LD_LIBRARY_PATH
     
deps=
    pytest
    pytest-cov

[testenv:flake8]
deps=
    flake8
commands=
    flake8

[flake8]
exclude=tests/*,setup.py,.tox/*,venv/*,.eggs/*,build/*,.pixi/*
filename=*.py
